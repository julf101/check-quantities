name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, to catch newly published vulnerabilities

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
